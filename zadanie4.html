<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SMART — интерактивная теория</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Nunito', Arial, sans-serif;
    background: radial-gradient(circle at 80% 10%, #312e81 0%, #0f172a 45%, #020617 100%);
    color: #e2e8f0;
    padding: 26px 14px 50px;
    display: flex;
    justify-content: center;
  }

  .wrap { width: 100%; max-width: 820px; }

  h1 {
    text-align: center;
    font-size: 28px;
    font-weight: 900;
    margin: 0 0 6px;
    background: linear-gradient(90deg, #38bdf8, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    text-align: center;
    color: #94a3b8;
    font-size: 15px;
    margin-bottom: 24px;
  }

  /* ===== Карточка с буквами ===== */
  .letters {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .letter-btn {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    border: 2px solid rgba(148, 163, 184, 0.25);
    background: rgba(30, 41, 59, 0.7);
    color: #e2e8f0;
    font-family: inherit;
    font-size: 26px;
    font-weight: 900;
    cursor: pointer;
    transition: transform 0.15s, background 0.25s, border-color 0.25s, box-shadow 0.25s;
    position: relative;
  }
  .letter-btn:hover { transform: translateY(-4px); }
  .letter-btn.active {
    background: linear-gradient(135deg, #38bdf8, #a78bfa);
    color: #0f172a;
    border-color: transparent;
    box-shadow: 0 10px 28px rgba(56, 189, 248, 0.5);
    transform: translateY(-4px) scale(1.06);
  }
  .letter-btn .hint-word {
    position: absolute;
    bottom: 4px;
    left: 0; right: 0;
    font-size: 9px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    opacity: 0.7;
  }

  /* ===== Панель критерия ===== */
  .panel {
    background: rgba(30, 41, 59, 0.72);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 22px;
    padding: 22px 22px 24px;
    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55);
    animation: fadeUp 0.4s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .panel .title {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .panel .title .big-letter {
    width: 54px; height: 54px;
    flex: 0 0 54px;
    border-radius: 14px;
    background: linear-gradient(135deg, #38bdf8, #a78bfa);
    color: #0f172a;
    font-size: 30px;
    font-weight: 900;
    display: flex; align-items: center; justify-content: center;
  }
  .panel .title h2 {
    margin: 0;
    font-size: 20px;
    color: #facc15;
  }
  .panel .title p {
    margin: 2px 0 0;
    font-size: 13px;
    color: #94a3b8;
  }

  .definition {
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(167, 139, 250, 0.12));
    border: 1px solid rgba(56, 189, 248, 0.35);
    border-radius: 12px;
    padding: 12px 16px;
    font-weight: 700;
    color: #e0f2fe;
    margin-bottom: 14px;
  }

  .check-q {
    font-weight: 800;
    margin-bottom: 10px;
    color: #cbd5e1;
  }

  /* Переключатель плохо/хорошо */
  .toggle {
    display: inline-flex;
    background: rgba(15, 23, 42, 0.8);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 14px;
    border: 1px solid rgba(148, 163, 184, 0.2);
  }
  .toggle button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    padding: 8px 18px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: #94a3b8;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .toggle button.on-bad { background: rgba(239, 68, 68, 0.25); color: #fca5a5; }
  .toggle button.on-good { background: rgba(34, 197, 94, 0.25); color: #4ade80; }

  .example-box {
    background: rgba(15, 23, 42, 0.85);
    border-left: 4px solid #a78bfa;
    border-radius: 12px;
    padding: 14px 16px;
    font-style: italic;
    color: #cbd5e1;
    min-height: 70px;
    margin-bottom: 16px;
    transition: border-color 0.3s;
  }
  .example-box.bad { border-left-color: #ef4444; }
  .example-box.good { border-left-color: #22c55e; }
  .example-box .label {
    display: inline-block;
    font-style: normal;
    font-weight: 900;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 6px;
    padding: 2px 8px;
    border-radius: 6px;
  }
  .example-box .label.bad { background: rgba(239, 68, 68, 0.25); color: #fca5a5; }
  .example-box .label.good { background: rgba(34, 197, 94, 0.25); color: #4ade80; }

  .why {
    font-size: 14px;
    color: #94a3b8;
    background: rgba(15, 23, 42, 0.6);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 16px;
  }
  .why b { color: #7dd3fc; }

  /* Мини-проверка */
  .mini {
    background: rgba(15, 23, 42, 0.6);
    border: 1px dashed rgba(148, 163, 184, 0.3);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .mini .mini-q {
    font-weight: 800;
    color: #e2e8f0;
    margin-bottom: 10px;
  }
  .mini .mini-opts button {
    display: block;
    width: 100%;
    text-align: left;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 10px 14px;
    margin: 7px 0;
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 10px;
    background: rgba(30, 41, 59, 0.7);
    color: #e2e8f0;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .mini .mini-opts button:hover:not(:disabled) {
    background: rgba(56, 189, 248, 0.16);
    border-color: #38bdf8;
  }
  .mini .mini-opts button.ok {
    background: rgba(34, 197, 94, 0.22);
    border-color: #22c55e;
    color: #4ade80;
  }
  .mini .mini-opts button.no {
    background: rgba(239, 68, 68, 0.22);
    border-color: #ef4444;
    color: #fca5a5;
  }
  .mini .mini-opts button:disabled { cursor: default; }
  .mini .mini-fb {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 700;
    color: #94a3b8;
    min-height: 18px;
  }
  .mini .mini-fb.ok { color: #4ade80; }
  .mini .mini-fb.no { color: #fca5a5; }

  /* Итог */
  .done {
    text-align: center;
    padding: 26px 20px;
    border-radius: 20px;
    display: none;
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.18), rgba(56, 189, 248, 0.18));
    border: 1px solid rgba(74, 222, 128, 0.5);
    margin-top: 18px;
  }
  .done.show { display: block; animation: fadeUp 0.5s ease; }
  .done h2 {
    margin: 0 0 8px;
    font-size: 22px;
    background: linear-gradient(90deg, #4ade80, #38bdf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .done p { color: #cbd5e1; margin: 4px 0; }

  /* Прогресс-точки */
  .dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .dots span {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(148, 163, 184, 0.25);
    transition: background 0.3s;
  }
  .dots span.done { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.7); }
  .dots span.active { background: #38bdf8; box-shadow: 0 0 10px rgba(56,189,248,0.8); }
</style>
</head>
<body>
<div class="wrap">
  <h1>SMART — интерактивная теория</h1>
  <div class="sub">Нажимай на буквы, читай, переключай «плохо / хорошо» и проверяй себя.</div>

  <div class="letters" id="letters"></div>
  <div class="dots" id="dots"></div>

  <div class="panel" id="panel"></div>

  <div class="done" id="done">
    <h2>Ты разобрал(а) все 5 критериев SMART 🎉</h2>
    <p>Теперь любая мечта превращается в цель, если добавить:</p>
    <p><b>Что? → Как измерю? → Реально? → Зачем? → К какому сроку?</b></p>
  </div>
</div>

<script>
var criteria = [
  {
    key: "S",
    word: "Specific",
    ru: "Конкретная",
    def: "Цель должна быть конкретной: понятно, <b>что именно</b> делаем.",
    question: "Проверь себя: конкретна ли цель?",
    bad: "«Хочу окончить школу.»",
    good: "«Окончу 9 класс без троек по всем предметам.»",
    whyBad: "Непонятно: какой класс, без каких оценок, по каким предметам — это мечта.",
    whyGood: "Есть класс (9), результат (без троек), охват (все предметы) — конкретно.",
    mini: {
      q: "Какая цель конкретная (S)?",
      opts: [
        { t: "«Буду лучше учиться»", ok: false, fb: "«Лучше» — размыто. Непонятно, что именно." },
        { t: "«Окончу 9 класс без троек»", ok: true, fb: "Верно! Понятно, какой класс и какой результат." }
      ]
    }
  },
  {
    key: "M",
    word: "Measurable",
    ru: "Измеримая",
    def: "Цель должна быть измеримой: есть <b>цифры или критерий успеха</b>.",
    question: "Проверь себя: как пойму, что достиг?",
    bad: "«Хорошо сдам экзамены.»",
    good: "«Сдам ОГЭ по 4 предметам не ниже 4.»",
    whyBad: "«Хорошо» — не цифра. Непонятно, когда считать, что цель достигнута.",
    whyGood: "Есть цифры: 4 предмета, порог 4. Легко проверить.",
    mini: {
      q: "Какая цель измеримая (M)?",
      opts: [
        { t: "«Нормально подготовлюсь»", ok: false, fb: "«Нормально» — не цифра и не критерий." },
        { t: "«Решу 100 заданий и сдам 3 пробных теста не ниже 80%»", ok: true, fb: "Верно! 100 заданий, 3 теста, 80% — всё измеримо." }
      ]
    }
  },
  {
    key: "A",
    word: "Achievable",
    ru: "Достижимая",
    def: "Цель должна быть реалистичной <b>для тебя и твоих ресурсов</b>.",
    question: "Проверь себя: это реально сделать?",
    bad: "«Выучу весь школьный курс за неделю.»",
    good: "«Занимаюсь по 1 часу в день в течение учебного года.»",
    whyBad: "Нереалистично: столько материала за неделю не освоить — цель сорвётся.",
    whyGood: "Реалистично: 1 час в день — посильный ресурс на длинной дистанции.",
    mini: {
      q: "Какая цель достижимая (A)?",
      opts: [
        { t: "«Стану отличницей за месяц»", ok: false, fb: "Слишком быстро и нереалистично." },
        { t: "«Буду заниматься по 1 часу в день весь год»", ok: true, fb: "Верно! Это посильно и растянуто во времени." }
      ]
    }
  },
  {
    key: "R",
    word: "Relevant",
    ru: "Значимая",
    def: "Цель должна быть значимой: понятно, <b>зачем</b> это тебе.",
    question: "Проверь себя: зачем мне эта цель?",
    bad: "«Окончу школу, потому что надо.»",
    good: "«Окончу школу, чтобы поступить в 10 класс на нужное направление.»",
    whyBad: "«Надо» — не ответ. Нет связи с личными планами — мотивация слабая.",
    whyGood: "Есть смысл: 10 класс и нужное направление — сильная личная мотивация.",
    mini: {
      q: "Какая цель значимая (R)?",
      opts: [
        { t: "«Потому что родители сказали»", ok: false, fb: "Внешняя мотивация слабая — цель не станет своей." },
        { t: "«Чтобы поступить в 10 класс на нужное направление»", ok: true, fb: "Верно! Цель связана с будущим." }
      ]
    }
  },
  {
    key: "T",
    word: "Time-bound",
    ru: "Со сроком",
    def: "Цель должна быть ограничена по времени: есть <b>дедлайн</b>.",
    question: "Проверь себя: к какому сроку?",
    bad: "«Когда-нибудь окончу школу.»",
    good: "«До 25 июня окончу 9 класс без троек.»",
    whyBad: "«Когда-нибудь» — не срок. Без даты цель не работает.",
    whyGood: "Есть конкретная дата — 25 июня. Можно планировать.",
    mini: {
      q: "Какая цель со сроком (T)?",
      opts: [
        { t: "«Скоро начну готовиться»", ok: false, fb: "«Скоро» — растяжимо. Нужна конкретная дата." },
        { t: "«До 25 июня окончу 9 класс без троек»", ok: true, fb: "Верно! Есть дедлайн — 25 июня." }
      ]
    }
  }
];

var current = 0;
var visited = {};

function renderLetters() {
  var box = document.getElementById("letters");
  box.innerHTML = "";
  for (var i = 0; i < criteria.length; i++) {
    (function (i) {
      var c = criteria[i];
      var b = document.createElement("button");
      b.className = "letter-btn" + (i === current ? " active" : "");
      b.innerHTML = c.key + "<span class='hint-word'>" + c.ru + "</span>";
      b.onclick = function () { current = i; render(); };
      box.appendChild(b);
    })(i);
  }
}

function renderDots() {
  var box = document.getElementById("dots");
  box.innerHTML = "";
  for (var i = 0; i < criteria.length; i++) {
    var s = document.createElement("span");
    if (visited[i]) s.className = "done";
    if (i === current) s.className = "active";
    box.appendChild(s);
  }
}

function render() {
  visited[current] = true;
  renderLetters();
  renderDots();

  var c = criteria[current];
  var panel = document.getElementById("panel");
  panel.innerHTML = "";

  // Заголовок
  var title = document.createElement("div");
  title.className = "title";
  title.innerHTML =
    "<div class='big-letter'>" + c.key + "</div>" +
    "<div><h2>" + c.ru + " · " + c.word + "</h2>" +
    "<p>" + c.question + "</p></div>";
  panel.appendChild(title);

  // Определение
  var def = document.createElement("div");
  def.className = "definition";
  def.innerHTML = c.def;
  panel.appendChild(def);

  // Переключатель
  var toggle = document.createElement("div");
  toggle.className = "toggle";
  var btnBad = document.createElement("button");
  btnBad.textContent = "Плохо";
  var btnGood = document.createElement("button");
  btnGood.textContent = "Хорошо";
  toggle.appendChild(btnBad);
  toggle.appendChild(btnGood);
  panel.appendChild(toggle);

  // Пример
  var example = document.createElement("div");
  example.className = "example-box";
  panel.appendChild(example);

  // Пояснение
  var why = document.createElement("div");
  why.className = "why";
  panel.appendChild(why);

  function showBad() {
    btnBad.className = "on-bad";
    btnGood.className = "";
    example.className = "example-box bad";
    example.innerHTML = "<span class='label bad'>Плохо</span><br>" + c.bad;
    why.innerHTML = "<b>Почему:</b> " + c.whyBad;
  }
  function showGood() {
    btnBad.className = "";
    btnGood.className = "on-good";
    example.className = "example-box good";
    example.innerHTML = "<span class='label good'>Хорошо</span><br>" + c.good;
    why.innerHTML = "<b>Почему:</b> " + c.whyGood;
  }
  btnBad.onclick = showBad;
  btnGood.onclick = showGood;
  showBad(); // по умолчанию

  // Мини-проверка
  var mini = document.createElement("div");
  mini.className = "mini";
  mini.innerHTML = "<div class='mini-q'>" + c.mini.q + "</div>";

  var opts = document.createElement("div");
  opts.className = "mini-opts";
  for (var i = 0; i < c.mini.opts.length; i++) {
    (function (i) {
      var o = c.mini.opts[i];
      var b = document.createElement("button");
      b.textContent = o.t;
      b.onclick = function () {
        var all = opts.getElementsByTagName("button");
        for (var k = 0; k < all.length; k++) all[k].disabled = true;
        if (o.ok) {
          b.className = "ok";
          fb.className = "mini-fb ok";
          fb.textContent = "✓ " + o.fb;
        } else {
          b.className = "no";
          fb.className = "mini-fb no";
          fb.textContent = "✗ " + o.fb;
          // показать правильный
          for (var m = 0; m < c.mini.opts.length; m++) {
            if (c.mini.opts[m].ok) all[m].className = "ok";
          }
        }
        checkAllDone();
      };
      opts.appendChild(b);
    })(i);
  }
  mini.appendChild(opts);

  var fb = document.createElement("div");
  fb.className = "mini-fb";
  mini.appendChild(fb);

  panel.appendChild(mini);
}

function checkAllDone() {
  var all = true;
  for (var i = 0; i < criteria.length; i++) {
    if (!visited[i]) all = false;
  }
  // показываем финал только когда все 5 посещены и текущий пройден
  if (all && current === criteria.length - 1) {
    // проверим, что мини текущего пройден
    var mini = document.querySelector(".mini-fb");
    if (mini && mini.textContent.indexOf("✓") === 0) {
      document.getElementById("done").className = "done show";
    }
  }
}

render();
</script>
</body>
</html>
